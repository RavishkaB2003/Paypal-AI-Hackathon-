version: '3.8'

services:
  paypulse-uat-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: paypulse-uat-backend
    environment:
      - PORT=3001
      - NODE_ENV=uat
      - SQLITE_DB_PATH=/app/data/paypulse.db
    volumes:
      - paypulse_uat_data:/app/data
    networks:
      paypulse-uat-net:
        aliases:
          - paypulse-backend

  paypulse-uat-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: paypulse-uat-frontend
    ports:
      - "5000:80"
    depends_on:
      paypulse-uat-backend:
        condition: service_healthy
    networks:
      - paypulse-uat-net

networks:
  paypulse-uat-net:
    driver: bridge

volumes:
  paypulse_uat_data: