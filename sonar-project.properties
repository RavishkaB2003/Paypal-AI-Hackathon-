# ==============================================================================
# PayPulse (v3 - Finity Matte Dark Bento Edition) SonarQube Configuration
# Zero-Tolerance Enterprise Quality Gate: 0 Bugs, 0 Vulnerabilities, 0 Hotspots, >=80% Coverage
# ==============================================================================
sonar.projectKey=paypulse
sonar.projectName=PayPulse - Finity Matte Dark Bento Edition
sonar.projectVersion=3.0.0

# Source and test inclusions
sonar.sources=src,server
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Strict Zero-Tolerance Quality Gate Configuration
sonar.qualitygate.wait=true

# Exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.spec.ts,data/**,artifacts/**,docs/**,public/**,*.config.ts
sonar.cpd.exclusions=src/shared/seeds.ts,tests/**