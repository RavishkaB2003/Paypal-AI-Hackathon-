version: '3.8'

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: paypulse-ci-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - paypulse-ci-net

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: paypulse-ci-jenkins
    user: root
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - paypulse-ci-net

networks:
  paypulse-ci-net:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  jenkins_home: